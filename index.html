cloud.t=()=>{if(!U)return;const ids=new Set();trades.forEach(t=>{ids.add(String(t.id));const s=JSON.stringify(t);if(last[t.id]!==s){if(s.length>950000){alert('This trade is too large for cloud sync. Delete a photo and save again.');return}last[t.id]=s;setDoc(doc(db,'users',U,'trades',String(t.id)),JSON.parse(s)).catch(e=>alert('Cloud save failed: '+e.code))}});Object.keys(last).forEach(id=>{if(!ids.has(id)){delete last[id];deleteDoc(doc(db,'users',U,'trades',id)).catch(()=>{})}})};
cloud.c=()=>{if(U)setDoc(cd(),{json:JSON.stringify(cfg)}).catch(()=>{})};
cloud.r=()=>{if(['logs','dash','cal','chart','ana','clock','calc'].includes(page)&&E('md').style.display!='block')show(page)};
onAuthStateChanged(auth,u=>{offs.forEach(f=>f());offs=[];
if(!u){U=null;cloud.user=null;trades=[];cfg=fresh();LS.set('tc_trades',[]);LS.set('tc_cfg',cfg);E('au').style.display='flex';show(page);return}
U=u.uid;cloud.user=u.email;E('au').style.display='none';first=true;last={};const local=trades.slice();
offs.push(onSnapshot(col(),s=>{const d=s.docs.map(x=>x.data());if(first&&!d.length&&local.length){first=false;trades=local;cloud.t();return}first=false;trades=d;last={};d.forEach(t=>last[t.id]=JSON.stringify(t));LS.set('tc_trades',trades);cloud.r()},e=>msg(e.code)));
offs.push(onSnapshot(cd(),s=>{if(s.exists()){cfg=Object.assign(fresh(),JSON.parse(s.data().json));LS.set('tc_cfg',cfg);if(page!='admin'&&page!='check')cloud.r()}else cloud.c()}));
show(page)});
E('ai').onclick=()=>signInWithEmailAndPassword(auth,em(),pw()).catch(er);
E('ac').onclick=()=>createUserWithEmailAndPassword(auth,em(),pw()).catch(er);
E('af').onclick=()=>em()?sendPasswordResetEmail(auth,em()).then(()=>msg('Password reset email sent.')).catch(er):msg('Enter your email first.');
document.addEventListener('click',e=>{if(e.target.id=='so')signOut(auth)});
}
